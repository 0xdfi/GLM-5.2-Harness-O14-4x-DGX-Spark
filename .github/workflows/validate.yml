name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  recipe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: PYTHONDONTWRITEBYTECODE=1 python3 reproducibility/verify.py
      - run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/validate.py
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: shasum -a 256 -c SHA256SUMS
